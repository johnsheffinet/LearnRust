[package]
name = "LearnRust"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.1.2" # cargo add ammonia
axum = { version = "0.8.8", features = ["macros"] } # cargo add axum --features macros
axum_csrf = "0.11.0" # cargo add axum-csrf
axum-error-handler = "0.2.1" # cargo add axum-error-handler
axum-governor = "1.0.3" # cargo add axum-governor
axum-response-cache = "0.4.0" # cargo add axum-response-cache
axum-server = { version = "0.8.0", features = ["tls-rustls"] } # cargo add axum-server --features tls-rustls
axum-valid = "0.24.0" # cargo add axum-valid
chrono = { version = "0.4.43", features = ["serde"] } # cargo add chrono --features serde
dashmap = "6.2.1" # cargo add dashmap
figment = { version = "0.10.19", features = ["env", "test"] } # cargo add figment --features env,test
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] } # cargo add jsonwebtoken --features aws_lc_rs
http-body-util = "0.1.3" # cargo add http-body-util
moka = { version = "0.12.16", features = ["future"] } # cargo moka --features future
rustls-pki-types = "1.14.0" # cargo add rustls-pki-types
secrecy = "0.10" # cargo add secrecy
serde = { version = "1.0.228", features = ["derive"] } # cargo add serde --features derive
serde_json = "1.0.149" # cargo add serde_json
thiserror = "2.0.18" # cargo add thiserror
tokio = { version = "1.49.0", features = ["full"] } # cargo add tokio --features full
tokio-util = { version = "0.7.18", features = ["rt"] } #cargo add tokio_util --features rt
tower = { version = "0.5.3", features = ["limit", "buffer", "util"] } # cargo add tower --features limit,buffer,util
tower-http = { version = "0.6.8", features = ["cors", "limit", "timeout", "trace"] } # cargo add tower-http --features cors,limit,timeout,trace
tracing = { version = "0.1.44", features = ["attributes"] } # cargo add tracing --features attributes
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter"] } # cargo add tracing-subscriber --features json,env-filter
uuid = { version = "1.23.1", features = ["serde", "v4"] } # cargo add uuid --features serde,v4
validator = { version = "0.20.0", features = ["derive"] } # cargo add validator --features derive

[dev-dependencies]
axum-test = "20.1.0" # cargo add axum-test --dev
cool_asserts = "2.0.4" # cargo add cool_asserts --dev
pretty_assertions = "1.4.1" # cargo add pretty_assertions --dev
rcgen = "0.14.7" # cargo add rcgen --dev
test-case = "3.3.1" # cargo add test-case --dev
test-log = { version = "0.2.19", features = ["trace"] } # cargo add test-log --features trace --dev
tokio-test = "0.4.5" # cargo add tokio-test --dev


